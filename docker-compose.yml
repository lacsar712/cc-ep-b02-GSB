services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
      POSTGRES_DB: provenance
    ports:
      - "54373:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance -d provenance"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8173:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://provenance:provenance@db:5432/provenance
      JWT_SECRET: experiment-provenance-dev-secret
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    command: python seed.py
    environment:
      DATABASE_URL: postgresql+psycopg2://provenance:provenance@db:5432/provenance
      JWT_SECRET: experiment-provenance-dev-secret
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3173:80"
    depends_on:
      - backend

volumes:
  pgdata:
